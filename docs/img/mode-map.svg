<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="Helvetica, Arial, sans-serif">
<rect width="880" height="540" fill="#232326"/>
<text x="16" y="24" font-size="15" font-weight="bold" fill="#e8e8ea">How to move between the modes</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b0b8d0"/></marker></defs>
<rect x="40" y="70" width="170" height="60" rx="10" fill="#3a3a3a" stroke="#6a7aa0"/><text x="125.0" y="94" font-size="14" font-weight="bold" text-anchor="middle" fill="#e8e8ea">Power on</text><text x="125.0" y="114" font-size="11" text-anchor="middle" fill="#9a9aa2">boot animation</text>
<rect x="300" y="70" width="190" height="70" rx="10" fill="#2f5a3a" stroke="#6a7aa0"/><text x="395.0" y="94" font-size="14" font-weight="bold" text-anchor="middle" fill="#e8e8ea">Note Mode</text><text x="395.0" y="114" font-size="11" text-anchor="middle" fill="#9a9aa2">chromatic, scale, drum, chord</text>
<rect x="300" y="230" width="190" height="70" rx="10" fill="#5a2f58" stroke="#6a7aa0"/><text x="395.0" y="254" font-size="14" font-weight="bold" text-anchor="middle" fill="#e8e8ea">Custom Modes</text><text x="395.0" y="274" font-size="11" text-anchor="middle" fill="#9a9aa2">8 built-in modes</text>
<rect x="300" y="390" width="190" height="70" rx="10" fill="#5a4a2f" stroke="#6a7aa0"/><text x="395.0" y="414" font-size="14" font-weight="bold" text-anchor="middle" fill="#e8e8ea">Sequencer</text><text x="395.0" y="434" font-size="11" text-anchor="middle" fill="#9a9aa2">5 tracks, keeps playing</text>
<rect x="640" y="70" width="190" height="70" rx="10" fill="#2f4a5a" stroke="#6a7aa0"/><text x="735.0" y="94" font-size="14" font-weight="bold" text-anchor="middle" fill="#e8e8ea">Session mode</text><text x="735.0" y="114" font-size="11" text-anchor="middle" fill="#9a9aa2">Ableton Live (DAW mode)</text>
<rect x="640" y="230" width="190" height="70" rx="10" fill="#5a2f2f" stroke="#6a7aa0"/><text x="735.0" y="254" font-size="14" font-weight="bold" text-anchor="middle" fill="#e8e8ea">Setup</text><text x="735.0" y="274" font-size="11" text-anchor="middle" fill="#9a9aa2">hold Session in any mode</text><text x="735.0" y="289" font-size="11" text-anchor="middle" fill="#9a9aa2">4 pages of settings</text>
<rect x="640" y="390" width="190" height="70" rx="10" fill="#3a3a3a" stroke="#6a7aa0"/><text x="735.0" y="414" font-size="14" font-weight="bold" text-anchor="middle" fill="#e8e8ea">Performance /
Programmer</text><text x="735.0" y="434" font-size="11" text-anchor="middle" fill="#9a9aa2">plain pads, host software</text>
<line x1="210" y1="100" x2="300" y2="100" stroke="#b0b8d0" stroke-width="2" marker-end="url(#a)"/><text x="255.0" y="94.0" font-size="11" text-anchor="middle" fill="#e8e8ea">automatic</text>
<line x1="395" y1="140" x2="395" y2="230" stroke="#b0b8d0" stroke-width="2" marker-end="url(#a)"/><text x="361.0" y="179.0" font-size="11" text-anchor="middle" fill="#e8e8ea">Custom</text>
<line x1="405" y1="230" x2="405" y2="140" stroke="#b0b8d0" stroke-width="2" marker-end="url(#a)"/><text x="441.0" y="179.0" font-size="11" text-anchor="middle" fill="#e8e8ea">Custom</text>
<line x1="395" y1="300" x2="395" y2="390" stroke="#b0b8d0" stroke-width="2" marker-end="url(#a)"/><text x="325.0" y="339.0" font-size="11" text-anchor="middle" fill="#e8e8ea">Capture + Custom</text>
<line x1="405" y1="390" x2="405" y2="300" stroke="#b0b8d0" stroke-width="2" marker-end="url(#a)"/><text x="441.0" y="339.0" font-size="11" text-anchor="middle" fill="#e8e8ea">Custom</text>
<line x1="490" y1="95" x2="640" y2="95" stroke="#b0b8d0" stroke-width="2" marker-end="url(#a)"/><text x="565.0" y="89.0" font-size="11" text-anchor="middle" fill="#e8e8ea">tap Session</text>
<line x1="640" y1="125" x2="490" y2="125" stroke="#b0b8d0" stroke-width="2" marker-end="url(#a)"/><text x="565.0" y="139.0" font-size="11" text-anchor="middle" fill="#e8e8ea">Note</text>
<line x1="640" y1="250" x2="490" y2="135" stroke="#b0b8d0" stroke-width="2" marker-end="url(#a)"/><text x="595.0" y="182.5" font-size="11" text-anchor="middle" fill="#e8e8ea">Session (back)</text>
<line x1="735" y1="300" x2="735" y2="390" stroke="#b0b8d0" stroke-width="2" marker-end="url(#a)"/><text x="705.0" y="339.0" font-size="11" text-anchor="middle" fill="#e8e8ea">choose</text>
<line x1="640" y1="420" x2="490" y2="135" stroke="#b0b8d0" stroke-width="2" marker-end="url(#a)"/><text x="625.0" y="301.5" font-size="11" text-anchor="middle" fill="#e8e8ea">Note</text>
<text x="16" y="500" font-size="12" fill="#9a9aa2">Pressing Custom inside the sequencer returns to the mode you came from. Setup returns to the previous mode when you press Session.</text>
<text x="16" y="520" font-size="12" fill="#9a9aa2">The Note button works from Performance, Custom and Session mode; in Programmer mode the host software gets every button.</text>

</svg>